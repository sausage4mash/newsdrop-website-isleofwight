<p id="output">Waiting for code...</p>
<button id="copy" hidden>Copy full code</button>

<script>
  const code = new URLSearchParams(window.location.search).get("code");

  if (code) {
    document.getElementById("output").textContent =
      `Authorization code received (${code.length} characters).`;
    const button = document.getElementById("copy");
    button.hidden = false;
    button.onclick = async () => {
      await navigator.clipboard.writeText(code);
      button.textContent = "Copied";
    };
  } else {
    document.getElementById("output").textContent = "No code found in redirect.";
  }
</script>
